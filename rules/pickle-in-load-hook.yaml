rules:
  - id: pickle-in-load-hook
    languages: [python]
    severity: INFO
    message: >-
      load_state_dict() 중 PyTorch가 자동으로 호출하는 훅 안에서 pickle로 역직렬화한다.
      torch.load의 weights_only는 이 경로를 보호하지 않는다(이미 열린 텐서 안의 바이트를
      다시 해석하기 때문). 입력이 체크포인트 파일에서 오는지, 호출 전에 거부/옵트인
      게이트가 있는지 확인할 것. 게이트가 있어도 이 규칙은 계속 잡힌다(정적 규칙은 게이트의
      유효성을 판단하지 못한다).
    metadata:
      cwe: "CWE-502"
      kind: guard-not-in-path
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: cPickle.loads(...)
      - pattern-inside: |
          def $HOOK(...):
              ...
      - metavariable-regex:
          metavariable: $HOOK
          regex: ^(set_extra_state|_load_from_state_dict|__setstate__)$
