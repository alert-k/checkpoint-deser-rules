rules:
  - id: torch-load-weights-only-false
    languages: [python]
    severity: WARNING
    message: >-
      torch.load()에 weights_only=False가 명시돼 있다. PyTorch 2.6+의 안전 기본값을
      호출한 쪽이 스스로 끄는 패턴이다. 반환값에서 텐서(state_dict 등)만 쓴다면 이 인자를
      지워도 동작이 같다. 경로가 사용자 설정(config/CLI)으로 들어오는지 도달성을 확인할 것.
    metadata:
      cwe: "CWE-502"
      kind: guard-disabled-by-caller
    pattern: torch.load(..., weights_only=False, ...)
